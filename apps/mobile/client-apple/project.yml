name: Astravia
options:
  bundleIdPrefix: com.astravia
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  AstraviaKit:
    path: AstraviaKit
  AstraviaRTC:
    path: AstraviaRTC
targets:
  Astravia:
    type: application
    platform: iOS
    sources:
      - path: Astravia
      - path: Shared
    dependencies:
      - package: AstraviaKit
      - package: AstraviaRTC
      - target: AstraviaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astravia.mobile
        PRODUCT_NAME: Astravia
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Astravia/Resources/Info.plist
        ENABLE_PREVIEWS: YES
    info:
      path: Astravia/Resources/Info.plist
      properties:
        CFBundleDisplayName: Astravia
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Landscape only on the remote desktop page; AppDelegate keeps every other page portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.astravia.mobile.pair
            CFBundleURLSchemes:
              - astravia
        NSCameraUsageDescription: Astravia uses the camera to scan the pairing code on your computer and to take photos you send.
        NSPhotoLibraryUsageDescription: Astravia shows your latest photos in the attach sheet so you can send one with a tap.
        NSMicrophoneUsageDescription: Astravia uses the microphone while you hold the message field to dictate.
        NSSpeechRecognitionUsageDescription: Astravia turns what you say into text for your message.
        NSLocalNetworkUsageDescription: Astravia needs local network access to connect directly to your computer on the same Wi-Fi.
        NSBonjourServices:
          - _astravia._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.astravia.mobile.refresh
  AstraviaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AstraviaWidgets
      - path: Shared
    dependencies:
      - package: AstraviaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astravia.mobile.widgets
        PRODUCT_NAME: AstraviaWidgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: AstraviaWidgets/Info.plist
    info:
      path: AstraviaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Astravia
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AstraviaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AstraviaUITests
    dependencies:
      - target: Astravia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astravia.mobile.uitests
        TEST_TARGET_NAME: Astravia
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Astravia:
    build:
      targets:
        Astravia: all
        AstraviaUITests: [test]
    test:
      targets:
        - AstraviaUITests
      gatherCoverageData: false
