# golangci-lint config for apps/ssh-helper.
#
# Mirrors apps/im-gateway so both Go packages in this repo are held to the same
# bar; follow that file if the shared set moves.
#
# v2 schema. errcheck / govet / ineffassign / staticcheck / unused are part of
# v2's default set, so they are not listed under `enable`. The `exclusions.presets`
# below reproduce v1's built-in exclusions.
version: "2"

linters:
  enable:
    - misspell
  settings:
    misspell:
      locale: US
    staticcheck:
      # Setting `checks` replaces the default set wholesale, so v2's own
      # exclusions (the ST10xx naming/comment rules it ships disabled) have to
      # be repeated here — otherwise they silently switch on.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files often need wide-open expectations; let them ignore errcheck
      # for things like setup helpers.
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - bin
      - dist
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - vetta-ssh-helper
  exclusions:
    generated: lax
    paths:
      - bin
      - dist
      - third_party$
      - builtin$
      - examples$

# Defaults cap reporting at 3 issues of the same kind, which hides the true
# backlog while fixing one. Report everything; CI should show the full set.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
