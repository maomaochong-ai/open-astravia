<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>下载 — 星轨 Astravia</title>
	<meta name="description" content="下载星轨 Astravia — 本地优先的开源 AI 桌面助手。" />
	<meta name="theme-color" content="#08080a" />
	<link rel="icon" href="/favicon.png" type="image/png" />
	<script>
		(() => {
			const stored = localStorage.getItem("astravia-theme");
			document.documentElement.dataset.theme = stored || "dark";

	<style>
		:root {
			--bg: #08080a;
			--elev: #101014;
			--tint: #0c0c0f;
			--line: #1e1e24;
			--line-strong: #2b2b33;
			--ink: #e9e9ec;
			--muted: #8e9199;
			--faint: #565964;
			--accent: #7c8aff;
			--accent-deep: #5e6ad2;
			--accent-soft: rgba(124, 138, 255, 0.13);
			--ease: cubic-bezier(0.16, 1, 0.3, 1);
			--font-sans: "Hanken Grotesk", Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
			--font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
		}

		* { margin: 0; padding: 0; box-sizing: border-box; }

		html { scroll-behavior: auto; }

		body {
			font-family: var(--font-sans);
			background: var(--bg);
			color: var(--ink);
			min-height: 100vh;
			overflow-x: hidden;
		}

		/* 导航 */
		.nav {
			position: fixed;
			inset: 0 0 auto;
			z-index: 100;
			background: rgba(8, 8, 10, 0.78);
			backdrop-filter: blur(16px) saturate(1.4);
			border-bottom: 1px solid transparent;
			transition: border-color 0.2s var(--ease);
			will-change: border-color;
		}
		.nav.is-scrolled { border-bottom-color: var(--line); }
		.nav__inner {
			display: flex;
			align-items: center;
			gap: 24px;
			height: 60px;
			max-width: 1120px;
			margin: 0 auto;
			padding: 0 24px;
		}
		.nav__brand {
			display: inline-flex;
			align-items: center;
			gap: 9px;
			font-weight: 700;
			font-size: 16px;
			text-decoration: none;
			color: var(--accent);
			margin-right: auto;
		}
		.nav__brand img { border-radius: 6px; }
		.nav__links { display: flex; gap: 2px; align-items: center; }
		.nav__links a {
			text-decoration: none;
			font-size: 14px;
			font-weight: 500;
			color: var(--muted);
			padding: 6px 11px;
			border-radius: 7px;
			transition: color 0.15s var(--ease), background-color 0.15s var(--ease);
		}
		.nav__links a:hover { color: var(--ink); }
		.nav__links a.is-active { color: var(--ink); background: var(--elev); }
		.nav__actions { display: flex; align-items: center; gap: 10px; }
		.theme-toggle {
			flex: 0 0 auto;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 34px;
			height: 34px;
			padding: 0;
			border-radius: 8px;
			border: 1px solid var(--line);
			background: transparent;
			color: var(--muted);
			cursor: pointer;
			transition: transform 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
		}
		.theme-toggle:hover { color: var(--ink); border-color: var(--muted); }
		.theme-toggle svg { display: none; }
		.theme-toggle.is-light .icon-sun, .theme-toggle.is-dark .icon-moon { display: block; }
		.btn--ghost {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 7px 12px;
			border-radius: 999px;
			font-size: 13.5px;
			font-weight: 600;
			text-decoration: none;
			color: var(--accent);
			background: var(--elev);
			border: 1px solid var(--line);
			transition: color 0.15s var(--ease), border-color 0.15s var(--ease);
		}
		.btn--ghost:hover { color: var(--ink); border-color: var(--muted); }

		/* 下载剧场 */
		.download-theater {
			position: relative;
			min-height: calc(100vh - 60px);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			padding: 48px 24px 80px;
		}
		.download-theater-beams {
			position: absolute;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
		}
		.download-theater-haze {
			position: absolute;
			inset: 0;
			background: radial-gradient(ellipse at 50% 30%, rgba(124, 138, 255, 0.06) 0%, transparent 55%);
		}
		.download-theater-beam {
			position: absolute;
			width: 1px;
			background: linear-gradient(to bottom, transparent, rgba(124, 138, 255, 0.12), transparent);
		}
		.download-theater-beam--a { left: 25%; height: 100%; }
		.download-theater-beam--b { left: 50%; height: 100%; }
		.download-theater-beam--c { left: 75%; height: 100%; }

		/* 掉落的平台图标 */
		.dl-platforms {
			position: relative;
			z-index: 10;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 16px;
			margin-bottom: 24px;
			height: 56px;
		}
		.dl-platform-icon {
			width: 52px;
			height: 52px;
			border-radius: 50%;
			background: var(--elev);
			border: 1px solid var(--line);
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			transform: translateY(-80px) scale(0.6);
		}
		.dl-platform-icon img {
			width: 28px;
			height: 28px;
			object-fit: contain;
		}
		.dl-platform-icon.is-rec {
			border-color: var(--accent);
			box-shadow: 0 0 20px -4px rgba(124, 138, 255, 0.4);
		}
		.dl-platform-icon.fall {
			animation: platform-fall 0.6s var(--ease) forwards;
		}
		.dl-platform-icon:nth-child(1) { animation-delay: 0.1s; }
		.dl-platform-icon:nth-child(2) { animation-delay: 0.2s; }
		.dl-platform-icon:nth-child(3) { animation-delay: 0.3s; }
		.dl-platform-icon:nth-child(4) { animation-delay: 0.4s; }
		.dl-platform-icon:nth-child(5) { animation-delay: 0.5s; }

		@keyframes platform-fall {
			0% { opacity: 0; transform: translateY(-80px) scale(0.6); }
			60% { opacity: 1; transform: translateY(6px) scale(1.05); }
			80% { transform: translateY(-3px) scale(0.98); }
			100% { opacity: 1; transform: translateY(0) scale(1); }
		}

		/* 标题 */
		.dl__title {
			position: relative;
			z-index: 10;
			font-size: clamp(40px, 6vw, 64px);
			font-weight: 700;
			letter-spacing: -0.02em;
			text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 30%, transparent);
			margin-bottom: 12px;
		}

		/* 描述 */
		.dl__desc {
			position: relative;
			z-index: 10;
			max-width: 480px;
			font-size: 15px;
			line-height: 1.7;
			color: var(--muted);
			margin-bottom: 40px;
			text-align: center;
		}

		/* 主下载按钮 — 复刻 Vetta */
		.dl__primary-wrap {
			position: relative;
			z-index: 10;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 10px;
		}
		.dl__primary {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			padding: 12px 24px;
			background: var(--elev);
			border: 2px solid var(--accent);
			border-radius: 999px;
			font-size: 14px;
			font-weight: 600;
			text-decoration: none;
			color: var(--ink);
			transition:
				background 0.15s var(--ease),
				transform 0.15s var(--ease),
				box-shadow 0.15s var(--ease);
			box-shadow: 0 0 0 2px var(--bg), 0 0 24px -6px rgba(124, 138, 255, 0.3);
			letter-spacing: 0.02em;
			text-transform: uppercase;
			min-width: 260px;
			justify-content: center;
		}
		.dl__primary:hover {
			background: var(--tint);
			transform: translateY(-1px);
			box-shadow: 0 0 0 2px var(--bg), 0 0 32px -6px rgba(124, 138, 255, 0.5);
		}
		.dl__primary svg { flex: none; }
		.dl__primary[aria-disabled="true"] {
			opacity: 0.4;
			pointer-events: none;
			cursor: default;
		}
		.dl__version {
			font-size: 13px;
			color: var(--faint);
			font-family: var(--font-mono);
		}

		/* 其他版本切换 */
		.dl__others-toggle {
			position: relative;
			z-index: 10;
			margin-top: 24px;
			background: none;
			border: none;
			color: var(--muted);
			font-size: 14px;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-family: var(--font-sans);
			transition: color 0.15s var(--ease);
		}
		.dl__others-toggle:hover { color: var(--ink); }
		.dl__others-toggle svg {
			transition: transform 0.2s var(--ease);
		}
		.dl__others-toggle.is-open svg { transform: rotate(180deg); }

		/* 其他版本面板 */
		.dl__others {
			position: relative;
			z-index: 10;
			margin-top: 12px;
			background: var(--elev);
			border: 1px solid var(--line);
			border-radius: 14px;
			overflow: hidden;
			max-height: 0;
			opacity: 0;
			transition: max-height 0.35s var(--ease), opacity 0.2s var(--ease);
		}
		.dl__others.is-open {
			max-height: 260px;
			opacity: 1;
		}
		.dl__others-list {
			list-style: none;
			margin: 0;
			padding: 6px 0;
		}
		.dl__others-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px 20px;
			text-decoration: none;
			color: var(--ink);
			transition: background 0.12s var(--ease);
		}
		.dl__others-item:hover { background: var(--tint); }
		.dl__others-item span { font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
		.dl__others-item small { font-size: 12px; color: var(--faint); font-family: var(--font-mono); }
		.dl-rec {
			font-size: 11px;
			color: var(--accent);
			font-weight: 600;
			padding: 1px 6px;
			background: var(--accent-soft);
			border-radius: 999px;
		}
		.dl__others-item.is-disabled {
			opacity: 0.4;
			cursor: default;
			pointer-events: none;
		}

		/* 页脚 */
		.footer {
			border-top: 1px solid var(--line);
			padding: 24px 0;
		}
		.footer .container {
			max-width: 1120px;
			margin: 0 auto;
			padding: 0 24px;
		}
		.footer__bottom {
			display: flex;
			justify-content: space-between;
			gap: 12px;
			flex-wrap: wrap;
		}
		.footer__bottom p {
			font-family: var(--font-mono);
			font-size: 12px;
			color: var(--faint);
			margin: 0;
		}
		.footer__links {
			display: inline-flex;
			align-items: center;
			gap: 8px;
		}
		.footer__links a {
			color: var(--faint);
			text-decoration: none;
			font-family: var(--font-mono);
			font-size: 12px;
			transition: color 0.18s;
		}
		.footer__links a:hover { color: var(--ink); }

		/* 移动适配 */
		@media (max-width: 560px) {
			.dl__title { font-size: 36px; }
			.dl__primary { min-width: auto; width: 100%; max-width: 300px; font-size: 13px; }
			.dl-platforms { gap: 10px; }
			.dl-platform-icon { width: 44px; height: 44px; }
			.dl-platform-icon img { width: 24px; height: 24px; }
		}
	</style>
</head>

	<script>
		(() => {
			const yearEl = document.getElementById("year");
			if (yearEl) yearEl.textContent = new Date().getFullYear();

			// 滚动导航底边线
			const nav = document.getElementById("nav");
			window.addEventListener("scroll", () => {
				nav.classList.toggle("is-scrolled", window.scrollY > 8);
			}, { passive: true });

			// 主题切换
			const THEME_KEY = "astravia-theme";
			const themeToggle = document.getElementById("themeToggle");
			const root = document.documentElement;

			function applyTheme(theme) {
				root.dataset.theme = theme;
				themeToggle.classList.toggle("is-light", theme === "light");
				themeToggle.classList.toggle("is-dark", theme === "dark");
				themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
				themeToggle.setAttribute("aria-label", theme === "dark" ? "切换到浅色模式" : "切换到深色模式");
			}

			applyTheme(root.dataset.theme);

			themeToggle.addEventListener("click", () => {
				const next = root.dataset.theme === "dark" ? "light" : "dark";
				applyTheme(next);
				localStorage.setItem(THEME_KEY, next);
			});

			// 平台检测
			const ua = navigator.userAgent;
			const isMac = /Mac/i.test(ua) && !/iPhone|iPad|iPod/i.test(ua);
			const isWin = /Win/i.test(ua);
			const isArm = /ARM|arm64|aarch64/i.test(ua);

			const dlPrimary = document.getElementById("dlPrimary");
			const dlPrimaryText = document.getElementById("dlPrimaryText");
			const dlPrimaryVersion = document.getElementById("dlPrimaryVersion");

			let detectedPlatform = "macos";
			if (isMac && isArm) {
				detectedPlatform = "macos";
				dlPrimary.href = "https://dl.astravia.dev/app/v0.55.37/Astravia-0.55.37-arm64.dmg";
				dlPrimaryText.textContent = "MAC ARM64 (APPLE SILICON)";
				dlPrimaryVersion.textContent = "v0.55.37 · DMG";
			} else if (isMac) {
				detectedPlatform = "macos";
				dlPrimary.href = "https://dl.astravia.dev/app/v0.55.37/Astravia-0.55.37.dmg";
				dlPrimaryText.textContent = "MAC X64 (INTEL)";
				dlPrimaryVersion.textContent = "v0.55.37 · DMG";
			} else if (isWin) {
				detectedPlatform = "windows";
				dlPrimary.href = "https://dl.astravia.dev/app/v0.55.37/Astravia-0.55.37-win-x64.exe";
				dlPrimaryText.textContent = "WINDOWS X64";
				dlPrimaryVersion.textContent = "v0.55.37 · EXE";
			} else {
				detectedPlatform = "linux";
				dlPrimary.setAttribute("aria-disabled", "true");
				dlPrimary.removeAttribute("href");
				dlPrimaryText.textContent = "LINUX (APPIMAGE)";
				dlPrimaryVersion.textContent = "即将推出";
			}

			// 高亮推荐平台图标
			const platforms = document.querySelectorAll(".dl-platform-icon");
			platforms.forEach((icon) => {
				if (icon.dataset.platform === detectedPlatform) {
					icon.classList.add("is-rec");
				}
			});

			// 掉落动画
			requestAnimationFrame(() => {
				for (const icon of platforms) icon.classList.add("fall");
			});

			// 展开/收起其他版本
			const toggle = document.getElementById("dlOthersToggle");
			const others = document.getElementById("dlOthers");
			if (toggle && others) {
				toggle.addEventListener("click", () => {
					const isOpen = others.classList.toggle("is-open");
					toggle.classList.toggle("is-open", isOpen);
				});
			}
		})();
	</script>
</body>
</html>
