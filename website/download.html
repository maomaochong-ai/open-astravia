<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>下载 — 星轨 Astravia</title>
	<meta name="description" content="下载星轨 Astravia — 本地优先的开源 AI 桌面助手。macOS / Windows 免费下载，Linux 即将推出。" />
	<meta name="theme-color" content="#08080a" />
	<link rel="icon" href="/favicon.png" type="image/png" />
	<script>
		(() => {
			const stored = localStorage.getItem("astravia-theme");
			document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
		})();
	</script>
	<script type="module" src="/src/main.ts"></script>
	<style>
		/* 下载页专用样式 */
		.dl-page {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 104px 24px;
			text-align: center;
		}

		.dl-page__icon {
			width: 56px;
			height: 56px;
			margin-bottom: 16px;
			color: var(--accent);
		}

		.dl-page__title {
			font-size: clamp(36px, 5vw, 56px);
			font-weight: 700;
			letter-spacing: -0.02em;
			margin: 0 0 12px;
		}

		.dl-page__desc {
			font-size: 16px;
			color: var(--muted);
			max-width: 480px;
			margin: 0 auto 40px;
			line-height: 1.6;
		}

		.dl-page__primary {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			padding: 14px 28px;
			background: var(--accent);
			color: var(--bg);
			border-radius: 999px;
			font-size: 16px;
			font-weight: 600;
			text-decoration: none;
			transition:
				background 0.15s var(--ease),
				transform 0.15s var(--ease),
				box-shadow 0.15s var(--ease);
			box-shadow: 0 4px 20px -8px rgba(124, 138, 255, 0.4);
		}

		.dl-page__primary:hover {
			background: var(--accent-deep);
			transform: translateY(-1px);
			box-shadow: 0 8px 28px -12px rgba(124, 138, 255, 0.5);
		}

		.dl-page__primary svg {
			flex: none;
		}

		.dl-page__version {
			margin-top: 12px;
			font-size: 13px;
			color: var(--faint);
			font-family: var(--font-mono);
		}

		.dl-page__others-toggle {
			margin-top: 24px;
			background: none;
			border: none;
			color: var(--muted);
			font-size: 14px;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			transition: color 0.15s var(--ease);
		}

		.dl-page__others-toggle:hover {
			color: var(--ink);
		}

		.dl-page__others-toggle svg {
			transition: transform 0.2s var(--ease);
		}

		.dl-page__others-toggle.is-open svg {
			transform: rotate(180deg);
		}

		.dl-page__others {
			margin-top: 16px;
			background: var(--elev);
			border: 1px solid var(--line);
			border-radius: 14px;
			overflow: hidden;
			max-height: 0;
			opacity: 0;
			transition:
				max-height 0.3s var(--ease),
				opacity 0.2s var(--ease);
		}

		.dl-page__others.is-open {
			max-height: 200px;
			opacity: 1;
		}

		.dl-page__others-list {
			list-style: none;
			margin: 0;
			padding: 8px 0;
		}

		.dl-page__others-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px 20px;
			text-decoration: none;
			color: var(--ink);
			transition: background 0.15s var(--ease);
		}

		.dl-page__others-item:hover {
			background: var(--tint);
		}

		.dl-page__others-item span {
			font-size: 14px;
		}

		.dl-page__others-item small {
			font-size: 12px;
			color: var(--faint);
			font-family: var(--font-mono);
		}

		.dl-page__others-item .dl-rec {
			margin-left: 8px;
			font-size: 11px;
			color: var(--accent);
			font-weight: 600;
		}
	</style>
</head>
<body>
	<!-- 导航 -->
	<header class="nav" id="nav">
		<div class="container nav__inner">
			<a class="nav__brand" href="/#top">
				<img src="/banner.png" width="26" height="26" alt="" />
				<span>Astravia</span>
			</a>
			<nav class="nav__links" aria-label="主导航">
				<a href="/#products">能力</a>
				<a href="/#models">模型</a>
				<a href="/#ecosystem">生态</a>
				<a href="/#privacy">隐私</a>
				<a href="/#download" class="is-active">下载</a>
			</nav>
			<div class="nav__actions">
				<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
					<svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" /></svg>
					<svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
				</button>
				<a class="btn btn--ghost nav__github" href="https://github.com/maomaochong-ai/astravia" target="_blank" rel="noopener">
					<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z" fill="currentColor" /></svg>
					<span>GitHub</span>
				</a>
			</div>
		</div>
	</header>

	<!-- 下载页主体 -->
	<main class="dl-page">
		<svg class="dl-page__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
		<h1 class="dl-page__title">下载</h1>
		<p class="dl-page__desc">我们会检测你的设备并推荐合适的版本。点击即可下载，或通过下方列表选择其他平台。</p>

		<a class="dl-page__primary" id="dlPrimary" href="#" target="_blank" rel="noopener">
			<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
			<span id="dlPrimaryText">下载 macOS 版</span>
		</a>
		<p class="dl-page__version" id="dlPrimaryVersion">v0.55.37 · DMG</p>

		<button class="dl-page__others-toggle" id="dlOthersToggle" type="button">
			其他版本
			<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9" /></svg>
		</button>

		<div class="dl-page__others" id="dlOthers">
			<ul class="dl-page__others-list">
				<li>
					<a class="dl-page__others-item" href="https://dl.astravia.dev/app/v0.55.37/Astravia-0.55.37-arm64.dmg" target="_blank" rel="noopener">
						<span>Mac Arm64 (Apple Silicon)<span class="dl-rec">推荐</span></span>
						<small>v0.55.37</small>
					</a>
				</li>
				<li>
					<a class="dl-page__others-item" href="https://dl.astravia.dev/app/v0.55.37/Astravia-0.55.37-x64.dmg" target="_blank" rel="noopener">
						<span>Mac x64 (Intel)</span>
						<small>v0.55.37</small>
					</a>
				</li>
				<li>
					<a class="dl-page__others-item" href="https://dl.astravia.dev/app/v0.55.37/Astravia-0.55.37-win-x64.exe" target="_blank" rel="noopener">
						<span>Windows x64</span>
						<small>v0.55.37</small>
					</a>
				</li>
				<li>
					<span class="dl-page__others-item" style="cursor:default;opacity:0.5">
						<span>Linux x64 (AppImage)</span>
						<small>即将推出</small>
					</span>
				</li>
			</ul>
		</div>
	</main>

	<!-- 页脚 -->
	<footer class="footer">
		<div class="container">
			<div class="footer__top">
				<a class="footer__brand" href="/#top">
					<img src="/banner.png" width="26" height="26" alt="" />
					<span>Astravia</span>
				</a>
			</div>
			<div class="footer__bottom">
				<p>© <span id="year">2026</span> Astravia · Apache-2.0</p>
			</div>
		</div>
	</footer>

	<script>
		(() => {
			// 年份
			const yearEl = document.getElementById("year");
			if (yearEl) yearEl.textContent = new Date().getFullYear();

			// 平台检测
			const ua = navigator.userAgent;
			const isMac = /Mac/i.test(ua) && !/iPhone|iPad|iPod/i.test(ua);
			const isWin = /Win/i.test(ua);
			const isArm = /ARM|arm64|aarch64/i.test(ua);

			const dlPrimary = document.getElementById("dlPrimary");
			const dlPrimaryText = document.getElementById("dlPrimaryText");
			const dlPrimaryVersion = document.getElementById("dlPrimaryVersion");
			const dlOthersToggle = document.getElementById("dlOthersToggle");
			const dlOthers = document.getElementById("dlOthers");

			if (isMac && isArm) {
				dlPrimary.href = "https://dl.astravia.dev/app/v0.55.37/Astravia-0.55.37-arm64.dmg";
				dlPrimaryText.textContent = "Mac Arm64 (Apple Silicon)";
				dlPrimaryVersion.textContent = "v0.55.37 · DMG";
			} else if (isMac) {
				dlPrimary.href = "https://dl.astravia.dev/app/v0.55.37/Astravia-0.55.37-x64.dmg";
				dlPrimaryText.textContent = "Mac x64 (Intel)";
				dlPrimaryVersion.textContent = "v0.55.37 · DMG";
			} else if (isWin) {
				dlPrimary.href = "https://dl.astravia.dev/app/v0.55.37/Astravia-0.55.37-win-x64.exe";
				dlPrimaryText.textContent = "Windows x64";
				dlPrimaryVersion.textContent = "v0.55.37 · EXE";
			} else {
				dlPrimary.href = "https://github.com/maomaochong-ai/astravia/releases";
				dlPrimaryText.textContent = "前往 GitHub 下载";
				dlPrimaryVersion.textContent = "查看所有版本";
			}

			// 展开/收起其他版本
			if (dlOthersToggle && dlOthers) {
				dlOthersToggle.addEventListener("click", () => {
					const isOpen = dlOthers.classList.toggle("is-open");
					dlOthersToggle.classList.toggle("is-open", isOpen);
				});
			}
		})();
	</script>
</body>
</html>
