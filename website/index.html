<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Astravia · 开源 Agent，为真实工作而生</title>
		<meta
			name="description"
			content="Astravia 面向工作与编程场景，与开源社区共同打造个人与企业可定制、可扩展、可掌控的 AI Agent。开源、本地优先、模型与密钥自配。"
		/>
		<meta name="theme-color" content="#000000" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
		<link rel="shortcut icon" href="/favicon-32.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preload" href="/fonts/hanken-grotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/ibm-plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
		<meta property="og:title" content="Astravia · 开源 Agent，为真实工作而生" />
		<meta property="og:description" content="对话、编码、文档、数据库与自动化，一个桌面应用全包。模型自配，数据留在本机。" />
		<meta property="og:image" content="/banner.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<style>
			/*
			 * 首屏底板：样式表还没到、React 还没挂载时，浏览器会先按默认白底画一帧。
			 * 这里把两套主题色都写进内联样式，刷新与跨路由都不闪白。
			 */
			html {
				background-color: #0a0a0a;
			}
			html[data-theme="light"] {
				background-color: #ffffff;
			}
		</style>
		<script>
			// 在样式与脚本生效前定住主题，避免先按默认色画一帧再跳回去。
			try {
				const stored = localStorage.getItem("astravia-theme");
				if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
			} catch (_) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
