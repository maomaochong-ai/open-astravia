name: desktop-promote

# 把 desktop-release 暂存在 R2 <prefix>/pending/<版本>/ 的更新清单上线：
# 合并 macOS 清单、核对安装包哈希、拒绝降级，然后发布到 <prefix>/ 并复核公网 feed。
# 运行后用户开始收到新版本：desktop-release 在全部平台构建成功后自动调用，
# 也可以手动触发（补上部分平台、或关闭自动上线的发版）。
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        type: string
        default: stable
      platforms:
        type: string
        default: windows,mac,linux
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to promote, for example 0.5.60."
        type: string
        required: true
      channel:
        description: "Update channel whose feed is promoted."
        type: choice
        options: [stable, test, default]
        default: stable
      platforms:
        description: "Comma-separated platforms to promote: windows, mac, linux."
        type: string
        default: windows,mac,linux
      dry_run:
        description: "Only verify staged metadata and installers; publish nothing."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  promote:
    name: promote ${{ inputs.version }} (${{ inputs.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.channel == 'test' && 'desktop-test' || 'desktop-production' }}
    permissions:
      contents: write
    concurrency:
      group: desktop-promote-${{ inputs.channel }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      # 与 desktop-release 使用同一套解析，保证上线的目录就是构建时上传安装包的目录。
      - name: Resolve R2 update target
        env:
          EVENT_NAME: workflow_dispatch
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_RELEASE_TARGET: r2
          VAR_RELEASE_CHANNEL: ${{ vars.VETTA_RELEASE_CHANNEL }}
          VAR_CLOUD_ENABLED: ${{ vars.VETTA_CLOUD_ENABLED }}
          VAR_R2_BUCKET: ${{ vars.VETTA_R2_BUCKET }}
          VAR_R2_PREFIX: ${{ vars.VETTA_R2_PREFIX }}
          VAR_R2_PREFIX_STABLE: ${{ vars.VETTA_R2_PREFIX_STABLE }}
          VAR_R2_PREFIX_TEST: ${{ vars.VETTA_R2_PREFIX_TEST }}
          VAR_SERVER_URL: ${{ vars.VETTA_SERVER_URL }}
          VAR_UPDATE_URL: ${{ vars.VETTA_UPDATE_URL }}
          VAR_UPDATE_URL_STABLE: ${{ vars.VETTA_UPDATE_URL_STABLE }}
          VAR_UPDATE_URL_TEST: ${{ vars.VETTA_UPDATE_URL_TEST }}
        run: node scripts/release/resolve-desktop-release-config.mjs --export-env >> "${GITHUB_ENV}"

      - name: Promote staged update metadata
        working-directory: apps/desktop
        env:
          VETTA_R2_ACCOUNT_ID: ${{ secrets.VETTA_R2_ACCOUNT_ID }}
          VETTA_R2_ACCESS_KEY_ID: ${{ secrets.VETTA_R2_ACCESS_KEY_ID }}
          VETTA_R2_SECRET_ACCESS_KEY: ${{ secrets.VETTA_R2_SECRET_ACCESS_KEY }}
          PROMOTE_VERSION: ${{ inputs.version }}
          PROMOTE_PLATFORMS: ${{ inputs.platforms }}
          PROMOTE_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          ARGS=(--version "${PROMOTE_VERSION}" --platforms "${PROMOTE_PLATFORMS}" --output-dir "${RUNNER_TEMP}/promoted")
          if [[ "${PROMOTE_DRY_RUN}" == "true" ]]; then ARGS+=(--dry-run); fi
          node scripts/promote-update-metadata-r2.mjs "${ARGS[@]}"

      # 同一份清单也附到 GitHub Release，保持下载页与 R2 一致；test 渠道没有 Release。
      - name: Attach promoted metadata to GitHub Release
        if: ${{ !inputs.dry_run && inputs.channel != 'test' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          gh release upload "v${PROMOTE_VERSION#v}" "${RUNNER_TEMP}"/promoted/latest*.yml --clobber
