name: Deploy Website to Cloudflare Pages

description: |
  构建官网（Vite + TypeScript 静态站），用 wrangler 部署到 Cloudflare Pages。
  触发时机：
  1. push 到 main 分支（任何 main 变更都重建官网）
  2. workflow_dispatch 手动触发
  3. release.published 事件
  4. desktop-release 在 R2 上传成功后以 workflow_call 调用，`ref` 指向它刚推的
     版本号分支——先把官网换成用户点得到的版本，合并留给人工

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  release:
    types: [published]
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the ref that triggered the caller)"
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: build & deploy → Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install & build website
        shell: bash
        run: |
          cd website
          bun install --frozen-lockfile
          bun run build

      - name: Ensure Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create astravia-website \
            --production-branch main \
            || echo "Project may already exist, continuing..."

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 这个作业经常从发布分支或 tag 检出，wrangler 会把检出点当成分支名，于是只生成
          # 预览部署，生产域名和 pages.dev 继续挂着上一版。站点内容与分支无关，统一钉到
          # 生产分支上，否则发版成功但用户下到的还是旧包。
          npx wrangler pages deploy website/dist \
            --project-name=astravia-website \
            --branch main

      - name: Bind custom domains via Cloudflare API
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="astravia-website"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"

          for domain in "www.astravia.dev" "astravia.dev"; do
            echo ">>> Binding $domain ..."
            RESP=$(curl -sS -X POST "$API" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -d "{\"name\": \"$domain\"}")
            echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Added!' if d.get('success') else f'⚠️  {d.get(\"errors\",[{\"message\":\"unknown\"}])[0].get(\"message\",\"\")}')"
            # 不让 "已存在" 阻塞 workflow
            true
          done

      - name: Verify website responds
        shell: bash
        run: |
          sleep 20
          for url in "https://astravia-website.pages.dev" "https://www.astravia.dev" "https://astravia.dev"; do
            status=$(curl -sI "$url" | head -1 || echo "FETCH_FAILED")
            echo "$url → $status"
          done
          # exit 0 兜底：DNS 传播需要时间，不阻塞 workflow
          exit 0
