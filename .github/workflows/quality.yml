name: quality

on:
  push:
    branches:
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: check + quality tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: quality-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check

      - name: Test quality scripts
        run: bun run test:quality

      - name: Verify runtime contract
        run: bun run verify:runtime-contract

      - name: Verify installed runtime artifact
        run: bun run verify:artifact:installed

  unit-tests:
    name: affected unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install --yes ripgrep; }

      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: command -v rg >/dev/null || brew install ripgrep

      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep --yes --no-progress }

      - name: Restore Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: quality-bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test affected workspaces
        run: bun run test:changed --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-run-summaries-${{ matrix.os }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 7
