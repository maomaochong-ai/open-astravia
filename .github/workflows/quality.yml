name: quality

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  check-and-test:
    name: check + quality tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check

      - name: Test quality scripts
        run: bun run test:quality

      - name: Verify runtime contract
        run: bun run verify:runtime-contract

      - name: Verify installed runtime artifact
        run: bun run verify:artifact:installed
