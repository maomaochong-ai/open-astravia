name: mobile

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".github/actions/install-bun-dependencies/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "bun.lock"
      - ".github/actions/install-bun-dependencies/**"
      - ".github/workflows/mobile.yml"

jobs:
  check-build:
    name: Typecheck + web export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Typecheck Expo app
        run: bun run --cwd apps/mobile typecheck

      - name: Lint Expo app
        run: bun run --cwd apps/mobile lint

      - name: Export web app
        run: bun run --cwd apps/mobile export:web
