name: mobile

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  build-test:
    name: Android build + host tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test shared Android host logic
        run: bash ./gradlew --no-daemon :shared:testAndroidHostTest

      - name: Assemble Android debug app
        run: bash ./gradlew --no-daemon :androidApp:assembleDebug
