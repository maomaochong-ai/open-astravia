name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TARGET: ${{ vars.VETTA_RELEASE_TARGET || 'github' }}

jobs:
  prepare:
    name: resolve desktop release scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-build: ${{ steps.scope.outputs.should-build }}

    steps:
      - uses: actions/checkout@v4

      - name: Match workflow event to desktop version
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should-build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          VERSION="$(node -p "require('./packages/desktop-app/package.json').version")"
          if [[ "${REF_NAME}" == "v${VERSION}" ]]; then
            echo "should-build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Ignoring ${REF_NAME}; desktop package version is ${VERSION}."
            echo "should-build=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.should-build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: dist:win
            verify: verify:updates:windows
            macArch: ""
          # arm64 与 x64 必须分两次构建：内置的 node/python 运行时按
          # VETTA_VENDOR_PLATFORM 单架构落盘，一次构建出不了两套。两次都会写同名的
          # latest-mac.yml，因此各自重命名后上传，由发布任务合并回单一元数据。
          - platform: macos-arm64
            runner: macos-latest
            command: dist:mac:arm64
            verify: verify:updates:mac
            macArch: arm64
          - platform: macos-x64
            runner: macos-latest
            command: dist:mac:x64
            verify: verify:updates:mac
            macArch: x64
          - platform: linux
            runner: ubuntu-latest
            command: dist:linux
            verify: verify:updates:linux
            macArch: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure macOS signing and notarization
        if: matrix.macArch != ''
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          REQUIRED=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            APPLE_API_KEY_P8_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
          )
          PROVIDED=0
          MISSING=()
          for NAME in "${REQUIRED[@]}"; do
            if [[ -n "${!NAME}" ]]; then
              PROVIDED=$((PROVIDED + 1))
            else
              MISSING+=("${NAME}")
            fi
          done
          if [[ "${PROVIDED}" -eq 0 ]]; then
            echo "No macOS signing secrets configured; building an unsigned macOS package."
            exit 0
          fi
          if [[ "${#MISSING[@]}" -ne 0 ]]; then
            echo "Incomplete macOS signing configuration: ${MISSING[*]}" >&2
            exit 1
          fi

          CERTIFICATE_PATH="${RUNNER_TEMP}/vetta-developer-id.p12"
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          PAYLOAD="${MACOS_CERTIFICATE_P12_BASE64}" OUTPUT_PATH="${CERTIFICATE_PATH}" \
            node -e 'require("node:fs").writeFileSync(process.env.OUTPUT_PATH, Buffer.from(process.env.PAYLOAD, "base64"))'
          PAYLOAD="${APPLE_API_KEY_P8_BASE64}" OUTPUT_PATH="${API_KEY_PATH}" \
            node -e 'require("node:fs").writeFileSync(process.env.OUTPUT_PATH, Buffer.from(process.env.PAYLOAD, "base64"))'
          chmod 600 "${CERTIFICATE_PATH}" "${API_KEY_PATH}"
          {
            echo "CSC_LINK=${CERTIFICATE_PATH}"
            echo "CSC_KEY_PASSWORD=${MACOS_CERTIFICATE_PASSWORD}"
            echo "APPLE_API_KEY=${API_KEY_PATH}"
            echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            echo "VETTA_REQUIRE_MAC_SIGNATURE=1"
          } >> "${GITHUB_ENV}"

      - name: Build updater artifacts
        working-directory: packages/desktop-app
        env:
          VETTA_UPDATE_PROVIDER: ${{ env.RELEASE_TARGET == 'r2' && 'generic' || 'github' }}
          VETTA_UPDATE_URL: ${{ vars.VETTA_UPDATE_URL }}
          VETTA_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          VETTA_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}
        run: bun run ${{ matrix.command }}

      - name: Verify platform updater artifacts
        if: matrix.verify != ''
        working-directory: packages/desktop-app
        run: bun run ${{ matrix.verify }}

      - name: Name macOS update metadata per architecture
        if: matrix.macArch != ''
        working-directory: packages/desktop-app
        shell: bash
        run: mv release/latest-mac.yml "release/latest-mac-${{ matrix.macArch }}.yml"

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/desktop-app/release/*.AppImage
            packages/desktop-app/release/*.blockmap
            packages/desktop-app/release/*.dmg
            packages/desktop-app/release/*.exe
            packages/desktop-app/release/*.zip
            packages/desktop-app/release/latest*.yml

  publish-r2:
    name: publish R2
    if: needs.prepare.outputs.should-build == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.VETTA_RELEASE_TARGET == 'r2'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-production
    concurrency:
      group: desktop-production-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: packages/desktop-app/release

      - name: Merge macOS update metadata
        working-directory: packages/desktop-app
        run: bun run merge:updates:mac

      - name: Publish artifacts before metadata
        working-directory: packages/desktop-app
        env:
          VETTA_R2_ACCOUNT_ID: ${{ secrets.VETTA_R2_ACCOUNT_ID }}
          VETTA_R2_ACCESS_KEY_ID: ${{ secrets.VETTA_R2_ACCESS_KEY_ID }}
          VETTA_R2_SECRET_ACCESS_KEY: ${{ secrets.VETTA_R2_SECRET_ACCESS_KEY }}
          VETTA_R2_BUCKET: ${{ vars.VETTA_R2_BUCKET }}
          VETTA_R2_PREFIX: ${{ vars.VETTA_R2_PREFIX }}
          VETTA_UPDATE_URL: ${{ vars.VETTA_UPDATE_URL }}
        run: bun run publish:updates:r2

  publish-github:
    name: publish GitHub Release
    if: needs.prepare.outputs.should-build == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.VETTA_RELEASE_TARGET != 'r2'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-production
    concurrency:
      group: desktop-production-publish
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: packages/desktop-app/release

      - name: Merge macOS update metadata
        working-directory: packages/desktop-app
        run: bun run merge:updates:mac

      - name: Publish release after all assets are ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/desktop-app/package.json').version")"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Refusing to modify published release ${TAG}." >&2
              exit 1
            fi
            echo "Resuming draft release ${TAG}"
          else
            gh release create "${TAG}" --draft --generate-notes --title "Vetta ${VERSION}"
          fi
          find packages/desktop-app/release -maxdepth 1 -type f -print0 \
            | xargs -0 gh release upload "${TAG}" --clobber
          gh release edit "${TAG}" --draft=false
