name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TARGET: ${{ vars.VETTA_RELEASE_TARGET || 'github' }}

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: dist:win
          - platform: macos
            runner: macos-latest
            command: dist:mac
          - platform: linux
            runner: ubuntu-latest
            command: dist:linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/desktop-app/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Build updater artifacts
        working-directory: packages/desktop-app
        env:
          VETTA_UPDATE_PROVIDER: ${{ env.RELEASE_TARGET == 'r2' && 'generic' || 'github' }}
          VETTA_UPDATE_URL: ${{ vars.VETTA_UPDATE_URL }}
          VETTA_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          VETTA_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}
        run: bun run ${{ matrix.command }}

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/desktop-app/release/*.AppImage
            packages/desktop-app/release/*.blockmap
            packages/desktop-app/release/*.dmg
            packages/desktop-app/release/*.exe
            packages/desktop-app/release/*.zip
            packages/desktop-app/release/latest*.yml

  publish-r2:
    name: publish R2
    if: vars.VETTA_RELEASE_TARGET == 'r2'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: packages/desktop-app/release

      - name: Publish artifacts before metadata
        working-directory: packages/desktop-app
        env:
          VETTA_R2_ACCOUNT_ID: ${{ secrets.VETTA_R2_ACCOUNT_ID }}
          VETTA_R2_ACCESS_KEY_ID: ${{ secrets.VETTA_R2_ACCESS_KEY_ID }}
          VETTA_R2_SECRET_ACCESS_KEY: ${{ secrets.VETTA_R2_SECRET_ACCESS_KEY }}
          VETTA_R2_BUCKET: ${{ vars.VETTA_R2_BUCKET }}
          VETTA_R2_PREFIX: ${{ vars.VETTA_R2_PREFIX }}
          VETTA_UPDATE_URL: ${{ vars.VETTA_UPDATE_URL }}
        run: bun run publish:updates:r2

  publish-github:
    name: publish GitHub Release
    if: vars.VETTA_RELEASE_TARGET != 'r2'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: packages/desktop-app/release

      - name: Publish release after all assets are ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/desktop-app/package.json').version")"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG}"
          else
            gh release create "${TAG}" --draft --generate-notes --title "Vetta ${VERSION}"
          fi
          find packages/desktop-app/release -maxdepth 1 -type f -print0 \
            | xargs -0 gh release upload "${TAG}" --clobber
          gh release edit "${TAG}" --draft=false
