name: desktop-cache

on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - package.json
      - apps/desktop/src/main/runtimes/manifest.json
      - apps/desktop/src/main/speech-input/model-manifest.json
      - apps/desktop/scripts/fetch-*
      - apps/desktop/scripts/speech-input-build-config.js
      - .github/actions/**
      - .github/workflows/desktop-cache.yml
  workflow_dispatch:
  # GitHub evicts unused caches. Scheduled runs also use the default branch scope.
  schedule:
    - cron: "23 3 * * 1,4"

permissions:
  contents: read

concurrency:
  group: desktop-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: warm ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Restore packaging tool downloads
        id: download-cache
        uses: ./.github/actions/desktop-download-cache
      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies
      - name: Prepare cached release resources
        uses: ./.github/actions/prepare-desktop-resources
      - name: Download Electron
        working-directory: apps/desktop
        shell: bash
        run: |
          node -e 'require("node:child_process").execFileSync(process.execPath, [require.resolve("electron/install.js")], { stdio: "inherit" })'
      - name: Save packaging tool downloads
        if: ${{ !cancelled() && steps.download-cache.outputs.tools-key != '' && steps.download-cache.outputs.tools-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.download-cache.outputs.tools-path }}
          key: ${{ steps.download-cache.outputs.tools-key }}-seed
