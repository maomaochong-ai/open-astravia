name: repair-linux-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to repair (e.g. 0.5.64)"
        type: string
        default: "0.5.64"

permissions:
  contents: write

jobs:
  repair:
    name: repair linux rpm and promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Resolve R2 update target
        env:
          EVENT_NAME: workflow_dispatch
          INPUT_CHANNEL: default
          INPUT_RELEASE_TARGET: r2
          VAR_RELEASE_CHANNEL: ${{ vars.VETTA_RELEASE_CHANNEL }}
          VAR_CLOUD_ENABLED: ${{ vars.VETTA_CLOUD_ENABLED }}
          VAR_R2_BUCKET: ${{ vars.VETTA_R2_BUCKET }}
          VAR_R2_PREFIX: ${{ vars.VETTA_R2_PREFIX }}
          VAR_R2_PREFIX_STABLE: ${{ vars.VETTA_R2_PREFIX_STABLE }}
          VAR_R2_PREFIX_TEST: ${{ vars.VETTA_R2_PREFIX_TEST }}
          VAR_SERVER_URL: ${{ vars.VETTA_SERVER_URL }}
          VAR_UPDATE_URL: ${{ vars.VETTA_UPDATE_URL }}
          VAR_UPDATE_URL_STABLE: ${{ vars.VETTA_UPDATE_URL_STABLE }}
          VAR_UPDATE_URL_TEST: ${{ vars.VETTA_UPDATE_URL_TEST }}
        run: node scripts/release/resolve-desktop-release-config.mjs --export-env >> "${GITHUB_ENV}"

      - name: Download release rpm from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rpm-download
          gh release download "v${{ inputs.version }}" -p "vetta-${{ inputs.version }}.x86_64.rpm" --dir /tmp/rpm-download
          ls -lh /tmp/rpm-download

      - name: Upload rpm to R2 with metadata
        working-directory: apps/desktop
        env:
          VETTA_R2_ACCOUNT_ID: ${{ secrets.VETTA_R2_ACCOUNT_ID }}
          VETTA_R2_ACCESS_KEY_ID: ${{ secrets.VETTA_R2_ACCESS_KEY_ID }}
          VETTA_R2_SECRET_ACCESS_KEY: ${{ secrets.VETTA_R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
          import { createReadStream } from "node:fs";
          import { stat } from "node:fs/promises";
          import { createHash } from "node:crypto";
          import { posix } from "node:path";
          import { S3Client } from "@aws-sdk/client-s3";
          import { Upload } from "@aws-sdk/lib-storage";

          async function hashFile(filePath) {
            const hash = createHash("sha512");
            for await (const chunk of createReadStream(filePath)) hash.update(chunk);
            return hash.digest("hex");
          }

          async function main() {
            const client = new S3Client({
              region: "auto",
              endpoint: `https://${process.env.VETTA_R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,
              credentials: {
                accessKeyId: process.env.VETTA_R2_ACCESS_KEY_ID,
                secretAccessKey: process.env.VETTA_R2_SECRET_ACCESS_KEY,
              },
            });

            const version = process.env.VERSION;
            const fileName = `vetta-${version}.x86_64.rpm`;
            const filePath = `/tmp/rpm-download/${fileName}`;
            const fileStat = await stat(filePath);
            const sha512 = await hashFile(filePath);
            const key = posix.join(process.env.VETTA_R2_PREFIX, fileName);

            console.log(`Uploading ${filePath} (${fileStat.size} bytes) to ${key} with sha512=${sha512}...`);
            const upload = new Upload({
              client,
              queueSize: 4,
              partSize: 16 * 1024 * 1024,
              leavePartsOnError: false,
              params: {
                Bucket: process.env.VETTA_R2_BUCKET,
                Key: key,
                Body: createReadStream(filePath),
                ContentLength: fileStat.size,
                ContentType: "application/x-rpm",
                CacheControl: "public, max-age=31536000, immutable",
                Metadata: { sha512 },
              },
            });
            await upload.done();
            console.log(`Successfully uploaded ${key}`);
          }

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: Promote update metadata
        working-directory: apps/desktop
        env:
          VETTA_R2_ACCOUNT_ID: ${{ secrets.VETTA_R2_ACCOUNT_ID }}
          VETTA_R2_ACCESS_KEY_ID: ${{ secrets.VETTA_R2_ACCESS_KEY_ID }}
          VETTA_R2_SECRET_ACCESS_KEY: ${{ secrets.VETTA_R2_SECRET_ACCESS_KEY }}
          PROMOTE_VERSION: ${{ inputs.version }}
          PROMOTE_PLATFORMS: windows,mac,linux
          PROMOTE_DRY_RUN: false
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/promoted"
          node scripts/promote-update-metadata-r2.mjs --version "${PROMOTE_VERSION}" --platforms "${PROMOTE_PLATFORMS}" --output-dir "${RUNNER_TEMP}/promoted"

      - name: Attach promoted metadata to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_VERSION: ${{ inputs.version }}
        shell: bash
        run: gh release upload "v${PROMOTE_VERSION#v}" "${RUNNER_TEMP}"/promoted/latest*.yml --clobber
