<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  /* ── 与内核 design token 统一（kernel.ts） ── */
  :root {
    color-scheme: dark;
    --wep-bg: #111827;
    --wep-panel: #111827;
    --wep-surface: #1f2937;
    --wep-surface-2: #374151;
    --wep-border: rgba(255, 255, 255, 0.1);
    --wep-text: #f9fafb;
    --wep-muted: #9ca3af;
    --wep-dim: #6b7280;
    --wep-accent: #6366f1;
    --wep-accent-2: #4f46e5;
    --wep-violet: #8b5cf6;
    --wep-danger: #ef4444;
    --wep-green: #34d399;
    --wep-radius: 8px;
    --wep-radius-lg: 12px;
    --shadow-panel: 0 12px 40px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    font: 13px/1.5 system-ui, -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    background: var(--wep-panel);
    color: var(--wep-text);
    padding: 14px;
  }

  /* ─── 头部：品牌 + 版本 ─── */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand-logo {
    flex: none; width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--wep-accent), var(--wep-violet));
    color: #fff;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
  }
  .brand-logo svg { width: 18px; height: 18px; }
  .brand-text { min-width: 0; }
  .header h1 { font-size: 14px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .version-chip {
    flex: none; font-size: 11px; font-weight: 600; color: var(--wep-muted);
    background: var(--wep-surface); border: 1px solid var(--wep-border);
    padding: 2px 9px; border-radius: 999px;
  }

  /* ─── 卡片容器 ─── */
  .card {
    background: var(--wep-surface);
    border: 1px solid var(--wep-border);
    border-radius: var(--wep-radius-lg);
    padding: 14px;
  }
  .card + .card { margin-top: 10px; }

  .card-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .muted { color: var(--wep-muted); }

  /* ─── 激活状态行 ─── */
  .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .status-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(52, 211, 153, 0.14); color: var(--wep-green);
    font-size: 11px; font-weight: 700;
  }
  .status-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-meta { font-size: 11px; color: var(--wep-muted); }

  /* ─── 主按钮 ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: var(--wep-radius); padding: 10px 14px;
    font: inherit; font-weight: 600; cursor: pointer; width: 100%;
    background: linear-gradient(135deg, var(--wep-accent), var(--wep-violet));
    color: #fff;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.stop { background: linear-gradient(135deg, var(--wep-danger), #f87171); }
  .btn svg { width: 15px; height: 15px; }

  .count-chip {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 9px; padding: 3px 10px; border-radius: 999px;
    background: rgba(99, 102, 241, 0.15); color: var(--wep-accent);
    font-size: 11px; font-weight: 700;
  }

  /* ─── 设置行（写轮眼开关） ─── */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 12px; padding: 10px 12px;
    background: var(--wep-surface-2); border: 1px solid var(--wep-border);
    border-radius: var(--wep-radius);
  }
  .setting-text { min-width: 0; }
  .setting-label { font-size: 12.5px; font-weight: 600; }
  .hint { font-size: 11px; color: var(--wep-muted); margin-top: 2px; line-height: 1.45; }
  .copy-hint {
    display: flex; align-items: flex-start; gap: 6px;
    margin-top: 12px; padding: 9px 11px;
    background: var(--wep-surface-2); border: 1px solid var(--wep-border);
    border-radius: var(--wep-radius);
    font-size: 11px; color: var(--wep-muted); line-height: 1.5;
  }
  .copy-hint svg { flex: none; width: 13px; height: 13px; margin-top: 1px; color: var(--wep-accent); }

  /* ─── 开关（iOS 风格） ─── */
  .switch { position: relative; width: 40px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--wep-dim);
    transition: background 0.2s ease;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .switch input:checked + .track { background: linear-gradient(135deg, var(--wep-accent), var(--wep-violet)); }
  .switch input:checked + .track::after { transform: translateX(16px); }

  /* ─── 授权激活表单 ─── */
  input[type="text"] {
    width: 100%; padding: 9px 12px; border-radius: var(--wep-radius);
    border: 1px solid var(--wep-border); background: var(--wep-surface-2); color: var(--wep-text);
    font: inherit; margin: 10px 0 8px;
    outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus { border-color: var(--wep-accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
  .buy-row { display: flex; justify-content: center; margin-top: 10px; }
  .link { color: var(--wep-accent); text-decoration: none; font-weight: 600; }
  .link:hover { text-decoration: underline; }

  .error { color: var(--wep-danger); font-size: 12px; margin-top: 8px; }
  .notice { color: var(--wep-green); font-size: 12px; margin-top: 8px; }

  .footer { color: var(--wep-dim); font-size: 11px; text-align: center; margin-top: 12px; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-logo" aria-hidden="true">
      <!-- 瞄准器十字线（与 IconCrosshair、图标生成脚本统一视觉语言） -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v4M12 17v4M3 12h4M17 12h4" />
        <circle cx="12" cy="12" r="2.5" />
      </svg>
    </div>
    <div class="brand-text">
      <h1 id="title">Astravia</h1>
    </div>
  </div>
  <span class="version-chip" id="version"></span>
</div>

<!-- 未激活：授权码激活 -->
<div id="license-view" class="card" hidden>
  <div class="card-title" id="license-title"></div>
  <div class="muted" id="not-licensed"></div>
  <input type="text" id="license-input" autocomplete="off" spellcheck="false" />
  <button class="btn" id="activate-btn"></button>
  <div id="license-error" class="error" hidden></div>
  <div class="buy-row">
    <a class="link" id="buy-link" href="#" target="_blank"></a>
  </div>
</div>

<!-- 已激活：控制面板 -->
<div id="control-view" class="card" hidden>
  <div class="status-row">
    <span class="status-chip" id="license-badge"></span>
    <span class="status-meta" id="license-meta"></span>
  </div>

  <button class="btn" id="toggle-btn"></button>
  <div id="count-label" class="count-chip" hidden></div>

  <div class="setting-row">
    <div class="setting-text">
      <div class="setting-label" id="sharingan-label"></div>
      <div class="hint" id="sharingan-hint"></div>
    </div>
    <label class="switch"><input type="checkbox" id="sharingan-input" /><span class="track"></span></label>
  </div>

  <div class="copy-hint" id="copy-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 6v12a3 3 0 1 1-6 0V6a3 3 0 1 1 6 0Z" />
      <path d="M9 12h6" />
    </svg>
    <span id="copy-hint-text"></span>
  </div>

  <div id="action-error" class="error" hidden></div>
  <div id="notice" class="notice" hidden></div>
</div>

<div class="footer" id="footer"></div>
<script src="popup.js"></script>
</body>
</html>
